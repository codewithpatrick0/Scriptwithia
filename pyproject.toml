[project]
name = "leadsmith"
version = "0.1.0"
description = "Enrich a CSV of companies with industry, size, summary and confidence using an LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "pandas>=3.0.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
leadsmith = "leadsmith.script:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
